<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>In Arbeit • Südamerika Abenteuer 2027</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient-start: #0f172a;
      --bg-gradient-end: #1e293b;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #22c55e;
      --primary-hover: #16a34a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --stefan-color: #3b82f6;
      --ines-color: #22c55e;
      --tanja-color: #f59e0b;
      --verena-color: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 640px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: var(--primary);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 8px rgba(34, 197, 94, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 32px;
    }

    .team-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .team-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot-stefan { background-color: var(--stefan-color); }
    .dot-ines { background-color: var(--ines-color); }
    .dot-tanja { background-color: var(--tanja-color); }
    .dot-verena { background-color: var(--verena-color); }

    .info-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 24px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .info-box p {
      margin-bottom: 12px;
    }

    .info-box p:last-child {
      margin-bottom: 0;
    }

    .icon-large {
      font-size: 2.5rem;
      margin-bottom: 16px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="status-badge">
      <span class="pulse-dot"></span>
      In Arbeit
    </div>

    <h1>Südamerika Abenteuer 2027</h1>
    <p class="subtitle">22.03.2027 – 28.05.2027</p>

    <div class="team-pills">
      <div class="team-pill">
        <span class="dot dot-stefan"></span> Stefan
      </div>
      <div class="team-pill">
        <span class="dot dot-ines"></span> Ines
      </div>
      <div class="team-pill">
        <span class="dot dot-tanja"></span> Tanja
      </div>
      <div class="team-pill">
        <span class="dot dot-verena"></span> Verena
      </div>
    </div>

    <div class="info-box">
      <span class="icon-large">🛠️</span>
      <p><strong>Reiseplan wird überarbeitet</strong></p>
      <p>Die Routenführung und Details werden gerade an die neuen Pläne angepasst. Die aktualisierte Übersicht steht in Kürze zur Verfügung.</p>
    </div>
  </div>

</body>
</html>
